<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Librería</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="encabezado">
    <h1>Mi Librería</h1>
    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#catalogo">Catálogo</a>
    </nav>
  </header>

  <main id="app">
    <section id="inicio" class="bienvenida">
      <h2>Bienvenido a Mi Librería</h2>
      <p>Descubre, agrega y guarda tus libros favoritos en un solo lugar.</p>
      <a href="#catalogo" class="boton">Ver catálogo</a>
    </section>

    <section id="catalogo" class="catalogo">
      <h2>Catálogo de libros</h2>
      <div id="lista-libros" class="lista-libros"></div>
      <p id="mensaje-vacio" class="vacio">Todavía no hay libros en el catálogo.</p>
    </section>

    <section id="agregar" class="agregar">
      <h2>Agregar un libro</h2>
      <form id="formulario-libro" class="formulario">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" required>

        <label for="autor">Autor</label>
        <input type="text" id="autor" required>

        <label for="precio">Precio (Bs)</label>
        <input type="number" id="precio" min="0" step="0.01" required>

        <button type="submit" class="boton">Guardar libro</button>
      </form>
    </section>
  </main>

  <footer class="pie">
    <p>&copy; 2026 Mi Librería. Proyecto Integrador de Git y GitHub.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
